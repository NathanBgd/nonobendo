<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Candidatures Alternance — Architecture & Design</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #6c8eff;
    --accent2: #a78bfa;
    --green: #22c55e;
    --yellow: #f59e0b;
    --orange: #f97316;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  /* ─── HEADER ─── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 700; color: var(--text); flex: 1; }
  .header h1 span { color: var(--accent); }

  /* ─── STATS ─── */
  .stats { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; text-align: center; min-width: 90px; }
  .stat .num { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat .lbl { font-size: 11px; color: var(--text2); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.s-total .num { color: var(--text); }
  .stat.s-postule .num { color: var(--accent); }
  .stat.s-attente .num { color: var(--yellow); }
  .stat.s-entretien .num { color: var(--purple); }
  .stat.s-accepte .num { color: var(--green); }
  .stat.s-refuse .num { color: var(--red); }

  /* ─── FILTERS ─── */
  .filters { padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters input[type=text] { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 12px; font-size: 13px; width: 220px; outline: none; }
  .filters input[type=text]:focus { border-color: var(--accent); }
  .filters select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none; cursor: pointer; }
  .filters select:focus { border-color: var(--accent); }
  .btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { opacity: 0.85; color: #fff; }
  .filters-info { color: var(--text3); font-size: 12px; margin-left: auto; }

  /* ─── TABLE ─── */
  .table-wrap { padding: 16px 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--surface2); color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--text); }
  thead th .sort-icon { opacity: 0.4; margin-left: 4px; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 12px; vertical-align: middle; }
  td.td-check { width: 36px; text-align: center; }
  td.td-nom { min-width: 160px; font-weight: 500; }
  td.td-nom a { color: var(--accent); text-decoration: none; }
  td.td-nom a:hover { text-decoration: underline; }
  td.td-ville { color: var(--text2); white-space: nowrap; }
  td.td-zone { white-space: nowrap; }
  td.td-type { color: var(--text2); font-size: 12px; max-width: 180px; }
  td.td-tel { white-space: nowrap; font-size: 12px; color: var(--text2); }
  td.td-statut { width: 140px; }
  td.td-date { width: 130px; }
  td.td-note { min-width: 120px; }
  td.td-actions { width: 40px; text-align: center; }

  /* ─── CHECKBOX ─── */
  .check-postule { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

  /* ─── STATUS SELECT ─── */
  .sel-statut { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 5px 8px; font-size: 12px; cursor: pointer; outline: none; }
  .sel-statut:focus { border-color: var(--accent); }
  .sel-statut.s-a_contacter { border-color: var(--text3); }
  .sel-statut.s-contacte { border-color: var(--blue); color: var(--blue); }
  .sel-statut.s-en_attente { border-color: var(--yellow); color: var(--yellow); }
  .sel-statut.s-relance { border-color: var(--orange); color: var(--orange); }
  .sel-statut.s-entretien { border-color: var(--purple); color: var(--purple); }
  .sel-statut.s-refuse { border-color: var(--red); color: var(--red); }
  .sel-statut.s-accepte { border-color: var(--green); color: var(--green); }

  /* ─── DATE INPUT ─── */
  .date-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 5px 8px; font-size: 12px; outline: none; }
  .date-input:focus { border-color: var(--accent); }
  .date-input::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }

  /* ─── NOTE INPUT ─── */
  .note-input { width: 100%; background: transparent; border: 1px solid transparent; color: var(--text2); border-radius: 5px; padding: 4px 8px; font-size: 12px; outline: none; resize: none; font-family: inherit; }
  .note-input:focus { background: var(--surface2); border-color: var(--border); color: var(--text); }
  .note-input::placeholder { color: var(--text3); }

  /* ─── ZONE BADGE ─── */
  .badge { display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-poitiers { background: #1e3a5f; color: #60a5fa; }
  .badge-bouscat { background: #1e3a3a; color: #34d399; }
  .badge-libourne { background: #3a1e3a; color: #c084fc; }
  .badge-saintes { background: #3a2e1e; color: #fbbf24; }
  .badge-angouleme { background: #3a1e1e; color: #f87171; }

  /* ─── ROW HIGHLIGHT ─── */
  tr.postule-row { background: rgba(108, 142, 255, 0.04); }
  tr.accepte-row { background: rgba(34, 197, 94, 0.05); }
  tr.refuse-row { opacity: 0.45; }

  /* ─── DELETE BTN ─── */
  .del-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; }
  .del-btn:hover { color: var(--red); background: rgba(239,68,68,0.1); }

  /* ─── EMPTY STATE ─── */
  .empty { text-align: center; padding: 60px; color: var(--text3); }

  /* ─── EXPORT ─── */
  .export-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── ADD MODAL ─── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 16px; margin-bottom: 20px; color: var(--text); }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .form-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; color: var(--text2); }
  .form-group input, .form-group select, .form-group textarea { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  @media (max-width: 768px) {
    .header, .filters, .stats, .table-wrap { padding: 12px; }
    .filters { gap: 6px; }
    .filters input[type=text] { width: 100%; }
    .stat { min-width: 70px; padding: 8px 10px; }
    .stat .num { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Suivi Candidatures <span>Alternance</span> — Architecture & Design</h1>
  <button class="btn primary" onclick="openAddModal()">+ Ajouter une entreprise</button>
  <button class="export-btn" onclick="exportExcel()">⬇ Export Excel</button>
</div>

<div class="stats" id="stats"></div>

<div class="filters">
  <input type="text" id="search" placeholder="🔍 Rechercher nom, ville, type…" oninput="render()">
  <select id="fZone" onchange="render()">
    <option value="">Toutes les zones</option>
    <option value="Poitiers">Poitiers (20km)</option>
    <option value="Le Bouscat / Bordeaux">Le Bouscat / Bordeaux (20km)</option>
    <option value="Libourne">Libourne (20km)</option>
    <option value="Saintes">Saintes (40km)</option>
    <option value="Angoulême">Angoulême (40km)</option>
  </select>
  <select id="fStatut" onchange="render()">
    <option value="">Tous les statuts</option>
    <option value="a_contacter">À contacter</option>
    <option value="contacte">Contacté</option>
    <option value="en_attente">En attente</option>
    <option value="relance">Relancé</option>
    <option value="entretien">Entretien</option>
    <option value="refuse">Refusé</option>
    <option value="accepte">Accepté</option>
  </select>
  <select id="fType" onchange="render()">
    <option value="">Tous les secteurs</option>
    <option value="architecture">Cabinet d'architecture</option>
    <option value="interieur">Architecte d'intérieur</option>
    <option value="decorateur">Décorateur / Designer</option>
    <option value="agenceur">Agenceur / Cuisiniste</option>
    <option value="bureau">Bureau d'études</option>
    <option value="moe">Maître d'œuvre</option>
    <option value="scenographie">Scénographie</option>
  </select>
  <select id="fPostule" onchange="render()">
    <option value="">Postulé & non postulé</option>
    <option value="oui">Postulé ✓</option>
    <option value="non">Pas encore postulé</option>
  </select>
  <button class="btn" onclick="resetFilters()">✕ Réinitialiser</button>
  <span class="filters-info" id="count-info"></span>
</div>

<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th class="td-check">✓</th>
        <th onclick="sortBy('nom')">Entreprise <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('ville')">Ville <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('zone')">Zone <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('distanceRef')">Distance <span class="sort-icon">↕</span></th>
        <th>Secteur</th>
        <th>Site / Tel</th>
        <th>Email</th>
        <th onclick="sortBy('statut')">Statut <span class="sort-icon">↕</span></th>
        <th>Date contact</th>
        <th>Date relance</th>
        <th>Notes</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Aucune entreprise ne correspond aux filtres.</div>
</div>

<!-- Modal ajout -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Ajouter une entreprise</h2>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>Nom de l'entreprise *</label>
        <input type="text" id="m-nom" placeholder="Ex: Cabinet Dupont Architecture">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>Adresse</label>
        <input type="text" id="m-adresse" placeholder="Ex: 12 rue de la Paix">
      </div>
      <div class="form-group">
        <label>Ville *</label>
        <input type="text" id="m-ville" placeholder="Ex: Poitiers">
      </div>
      <div class="form-group" style="max-width:80px">
        <label>CP</label>
        <input type="text" id="m-cp" placeholder="86000">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Zone *</label>
        <select id="m-zone">
          <option value="Poitiers">Poitiers (20km)</option>
          <option value="Le Bouscat / Bordeaux">Le Bouscat / Bordeaux (20km)</option>
          <option value="Libourne">Libourne (20km)</option>
          <option value="Saintes">Saintes (40km)</option>
          <option value="Angoulême">Angoulême (40km)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" id="m-tel" placeholder="05 XX XX XX XX">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>Site web</label>
        <input type="text" id="m-site" placeholder="www.exemple.fr">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>Type d'activité</label>
        <input type="text" id="m-type" placeholder="Ex: Cabinet d'architecture, Agenceur cuisines…">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Notes</label>
        <textarea id="m-notes" rows="2" placeholder="Contact RH, responsable…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">Annuler</button>
      <button class="btn primary" onclick="addCompany()">Ajouter</button>
    </div>
  </div>
</div>

  const txt = (company.type || '').toLowerCase();
  const kws = TYPE_MAP[filterType] || [];
  return kws.some(k => txt.includes(k));
}

function loadData() {
  try { userData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { userData = {}; }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
}

function getCompanyData(id) {
  if (!userData[id]) userData[id] = { postule: false, statut: 'a_contacter', dateContact: '', dateRelance: '', notes: '' };
  return userData[id];
}

function getAllCompanies() {
  const custom = userData._custom || [];
  return [...BASE_COMPANIES, ...custom];
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function render() {
  const search   = document.getElementById('search').value.toLowerCase();
  const fZone    = document.getElementById('fZone').value;
  const fStatut  = document.getElementById('fStatut').value;
  const fType    = document.getElementById('fType').value;
  const fPostule = document.getElementById('fPostule').value;

  let companies = getAllCompanies();

  // Filter
  companies = companies.filter((c, i) => {
    const d = getCompanyData(c._id || i);
    if (search && !( (c.nom||'').toLowerCase().includes(search) || (c.ville||'').toLowerCase().includes(search) || (c.type||'').toLowerCase().includes(search) || (c.cp||'').includes(search) )) return false;
    if (fZone && c.zone !== fZone) return false;
    if (fStatut && d.statut !== fStatut) return false;
    if (!matchesType(c, fType)) return false;
    if (fPostule === 'oui' && !d.postule) return false;
    if (fPostule === 'non' && d.postule) return false;
    return true;
  });

  // Sort
  companies = companies.sort((a, b) => {
    const da = getCompanyData(a._id || getAllCompanies().indexOf(a));
    const db = getCompanyData(b._id || getAllCompanies().indexOf(b));
    let va, vb;
    if (sortField === 'statut') { va = da.statut; vb = db.statut; }
    else { va = (a[sortField] || '').toLowerCase(); vb = (b[sortField] || '').toLowerCase(); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  // Update sort headers
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));

  // Count
  document.getElementById('count-info').textContent = `${companies.length} entreprise${companies.length > 1 ? 's' : ''} affichée${companies.length > 1 ? 's' : ''}`;

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');

  if (companies.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    renderStats();
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = companies.map((c, idx) => {
    const globalIdx = getAllCompanies().findIndex(x => x === c);
    const id = c._id || globalIdx;
    const d = getCompanyData(id);
    const zoneClass = zoneBadgeClass(c.zone);
    let rowClass = '';
    if (d.statut === 'accepte') rowClass = 'accepte-row';
    else if (d.statut === 'refuse') rowClass = 'refuse-row';
    else if (d.postule) rowClass = 'postule-row';

    const siteTxt = c.site ? c.site.replace(/^https?:\/\//, '').replace(/\/$/, '') : '';
    const siteHref = c.site ? (c.site.startsWith('http') ? c.site : 'https://' + c.site) : '';

    const emailHref = c.email ? `<a href="mailto:${c.email}" style="color:var(--accent);font-size:11px">${c.email}</a>` : '<span style="color:var(--text3);font-size:11px">—</span>';
    const distTxt = c.distanceRef ? `<span style="font-size:11px;color:var(--text2)">${c.distanceRef}</span>` : '—';

    return `<tr class="${rowClass}" id="row-${id}">
      <td class="td-check"><input type="checkbox" class="check-postule" ${d.postule ? 'checked' : ''} onchange="toggle('postule',${id},this.checked)"></td>
      <td class="td-nom">
        ${siteHref ? `<a href="${siteHref}" target="_blank">${c.nom}</a>` : c.nom}
        ${c.tel ? `<div style="color:var(--text3);font-size:11px;margin-top:2px">${c.tel}</div>` : ''}
      </td>
      <td class="td-ville">${c.ville}${c.cp ? ` <span style="color:var(--text3)">${c.cp}</span>` : ''}</td>
      <td class="td-zone"><span class="badge ${zoneClass}">${c.zone}</span></td>
      <td class="td-tel">${distTxt}</td>
      <td class="td-type">${c.type || '—'}</td>
      <td class="td-tel">${siteTxt ? `<a href="${siteHref}" target="_blank" style="color:var(--text3);font-size:11px">${siteTxt}</a>` : '—'}</td>
      <td class="td-tel">${emailHref}</td>
      <td class="td-statut">
        <select class="sel-statut s-${d.statut}" onchange="toggle('statut',${id},this.value);this.className='sel-statut s-'+this.value">
          ${Object.entries(STATUTS).map(([k,v]) => `<option value="${k}" ${d.statut===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </td>
      <td class="td-date"><input type="date" class="date-input" value="${d.dateContact||''}" onchange="toggle('dateContact',${id},this.value)" title="Date de premier contact"></td>
      <td class="td-date"><input type="date" class="date-input" value="${d.dateRelance||''}" onchange="toggle('dateRelance',${id},this.value)" title="Date de relance"></td>
      <td class="td-note"><textarea class="note-input" rows="1" placeholder="Notes…" onchange="toggle('notes',${id},this.value)">${d.notes||''}</textarea></td>
      <td class="td-actions"><button class="del-btn" onclick="deleteCompany(${id})" title="Supprimer">✕</button></td>
    </tr>`;
  }).join('');

  renderStats();
}

function zoneBadgeClass(zone) {
  if (!zone) return '';
  const z = zone.toLowerCase();
  if (z.includes('poitiers')) return 'badge-poitiers';
  if (z.includes('bouscat') || z.includes('bordeaux')) return 'badge-bouscat';
  if (z.includes('libourne')) return 'badge-libourne';
  if (z.includes('saintes')) return 'badge-saintes';
  if (z.includes('angoulême') || z.includes('angouleme')) return 'badge-angouleme';
  return '';
}

function renderStats() {
  const all = getAllCompanies();
  const totals = { total: all.length, postule: 0, contacte: 0, attente: 0, entretien: 0, refuse: 0, accepte: 0 };
  all.forEach((c, i) => {
    const d = getCompanyData(c._id || i);
    if (d.postule) totals.postule++;
    if (d.statut === 'contacte' || d.statut === 'en_attente' || d.statut === 'relance') totals.contacte++;
    if (d.statut === 'en_attente' || d.statut === 'relance') totals.attente++;
    if (d.statut === 'entretien') totals.entretien++;
    if (d.statut === 'refuse') totals.refuse++;
    if (d.statut === 'accepte') totals.accepte++;
  });
  document.getElementById('stats').innerHTML = `
    <div class="stat s-total"><div class="num">${totals.total}</div><div class="lbl">Total</div></div>
    <div class="stat s-postule"><div class="num">${totals.postule}</div><div class="lbl">Postulé</div></div>
    <div class="stat s-contacte" style="--n:var(--blue)"><div class="num" style="color:var(--blue)">${totals.contacte}</div><div class="lbl">Contacté</div></div>
    <div class="stat s-attente"><div class="num">${totals.attente}</div><div class="lbl">En attente</div></div>
    <div class="stat s-entretien"><div class="num">${totals.entretien}</div><div class="lbl">Entretien</div></div>
    <div class="stat s-accepte"><div class="num">${totals.accepte}</div><div class="lbl">Accepté</div></div>
    <div class="stat s-refuse"><div class="num">${totals.refuse}</div><div class="lbl">Refusé</div></div>
  `;
}

// ═══════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════
function toggle(field, id, value) {
  const d = getCompanyData(id);
  d[field] = value;
  saveData();
  if (field === 'statut') {
    if (value !== 'a_contacter') { d.postule = true; }
    const row = document.getElementById('row-' + id);
    if (row) {
      row.className = value === 'accepte' ? 'accepte-row' : value === 'refuse' ? 'refuse-row' : d.postule ? 'postule-row' : '';
    }
  }
  renderStats();
}

function sortBy(field) {
  if (sortField === field) sortAsc = !sortAsc;
  else { sortField = field; sortAsc = true; }
  render();
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('fZone').value = '';
  document.getElementById('fStatut').value = '';
  document.getElementById('fType').value = '';
  document.getElementById('fPostule').value = '';
  render();
}

function deleteCompany(id) {
  const all = getAllCompanies();
  const c = all.find((x, i) => (x._id || i) === id);
  if (!c) return;
  if (!confirm(`Supprimer "${c.nom}" ?`)) return;
  if (c._id) {
    userData._custom = (userData._custom || []).filter(x => x._id !== id);
  }
  delete userData[id];
  saveData();
  render();
}

// ─── ADD MODAL ───
function openAddModal() {
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
  ['m-nom','m-adresse','m-ville','m-cp','m-tel','m-site','m-type','m-notes'].forEach(id => { document.getElementById(id).value = ''; });
}

document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

function addCompany() {
  const nom = document.getElementById('m-nom').value.trim();
  const ville = document.getElementById('m-ville').value.trim();
  if (!nom || !ville) { alert('Nom et ville sont requis.'); return; }
  const id = 'custom_' + Date.now();
  const company = {
    _id: id,
    nom,
    adresse: document.getElementById('m-adresse').value.trim(),
    ville,
    cp: document.getElementById('m-cp').value.trim(),
    tel: document.getElementById('m-tel').value.trim(),
    site: document.getElementById('m-site').value.trim(),
    type: document.getElementById('m-type').value.trim(),
    zone: document.getElementById('m-zone').value,
  };
  if (!userData._custom) userData._custom = [];
  userData._custom.push(company);
  const notes = document.getElementById('m-notes').value.trim();
  userData[id] = { postule: false, statut: 'a_contacter', dateContact: '', dateRelance: '', notes };
  saveData();
  closeAddModal();
  render();
}

// ─── EXPORT EXCEL ───
function exportExcel() {
  const all = getAllCompanies();
  const header = ['Nom','Ville','CP','Zone','Secteur','Téléphone','Site Web','Email','Distance','Postulé','Statut','Date Contact','Date Relance','Notes'];

  const rows = all.map((c, i) => {
    const d = getCompanyData(c._id || i);
    const s = STATUTS[d.statut] || {};
    return [
      c.nom || '',
      c.ville || '',
      c.cp || '',
      c.zone || '',
      c.type || '',
      c.tel || '',
      c.site || '',
      c.email || '',
      c.distanceRef || '',
      d.postule ? 'Oui' : 'Non',
      s.label || d.statut || '',
      d.dateContact || '',
      d.dateRelance || '',
      d.notes || '',
    ];
  });

  const wsData = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Style header row
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let C = range.s.c; C <= range.e.c; C++) {
    const cell = ws[XLSX.utils.encode_cell({ r: 0, c: C })];
    if (cell) {
      cell.s = { font: { bold: true }, fill: { fgColor: { rgb: '1a1d27' } } };
    }
  }

  // Column widths
  ws['!cols'] = [
    { wch: 35 }, // Nom
    { wch: 20 }, // Ville
    { wch: 6  }, // CP
    { wch: 22 }, // Zone
    { wch: 40 }, // Secteur
    { wch: 16 }, // Tel
    { wch: 30 }, // Site
    { wch: 32 }, // Email
    { wch: 22 }, // Distance
    { wch: 8  }, // Postulé
    { wch: 14 }, // Statut
    { wch: 14 }, // Date Contact
    { wch: 14 }, // Date Relance
    { wch: 40 }, // Notes
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Candidatures');

  // Feuille stats
  const statsData = [
    ['Statistiques', ''],
    ['Total entreprises', all.length],
    ['Postulé', all.filter((c,i) => getCompanyData(c._id||i).postule).length],
    ['En attente / Relancé', all.filter((c,i) => ['en_attente','relance'].includes(getCompanyData(c._id||i).statut)).length],
    ['Entretien', all.filter((c,i) => getCompanyData(c._id||i).statut === 'entretien').length],
    ['Accepté', all.filter((c,i) => getCompanyData(c._id||i).statut === 'accepte').length],
    ['Refusé', all.filter((c,i) => getCompanyData(c._id||i).statut === 'refuse').length],
  ];
  const wsStats = XLSX.utils.aoa_to_sheet(statsData);
  wsStats['!cols'] = [{ wch: 25 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, wsStats, 'Stats');

  XLSX.writeFile(wb, 'candidatures_alternance.xlsx');
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadData();
render();
</script>
